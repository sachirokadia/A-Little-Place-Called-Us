services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: little_place
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/little_place
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads
volumes:
  pgdata:
  uploads:
